<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concurso de Fantasias — Halloween DAF 2026</title>
<meta name="theme-color" content="#160a2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noite:#120822; --noite-2:#1d0e36; --violeta:#3a1a66; --card:#1c0f33; --card-2:#24143f;
  --rosa:#ff4fd8; --rosa-claro:#ffd6f7; --lilas:#b44bff; --ouro:#ffb347; --laranja:#ff7a1a;
  --lima:#c3ff3d; --lima-texto:#dcff80; --texto:#f3eaff; --suave:#bba8d9; --linha:rgba(255,255,255,.12); --erro:#ff8a9a;
  --neon:"Tilt Neon", "Arial Rounded MT Bold", system-ui, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--noite)}
body{margin:0;min-height:100vh;color:var(--texto);font-family:var(--cond);font-size:19px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg, #120822 0%, #170a2a 60%, #1d0e36 100%) fixed;
  padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lima);outline-offset:3px}

/* ---------- Topo: céu, lua, orla ---------- */
.hero{position:relative;overflow:hidden;padding:calc(1.5rem + env(safe-area-inset-top,0px)) 0 0;text-align:center;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 28% 8%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 47% 22%, #e9dcff 50%, transparent 51%),
    radial-gradient(1px 1px at 63% 12%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 26%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 9%, #e9dcff 50%, transparent 51%),
    radial-gradient(1px 1px at 35% 34%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 93% 38%, #fff 50%, transparent 51%),
    linear-gradient(180deg, #160a2b 0%, #2b1352 55%, #4a2276 100%)}
.moon{position:absolute;top:calc(1rem + env(safe-area-inset-top,0px));left:3%;width:clamp(52px,12vw,110px);aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 62% 40%, rgba(150,130,190,.55) 0 9%, transparent 10%),
    radial-gradient(circle at 38% 64%, rgba(150,130,190,.45) 0 12%, transparent 13%),
    radial-gradient(circle at 30% 30%, rgba(150,130,190,.35) 0 6%, transparent 7%),
    radial-gradient(circle at 40% 38%, #fbf7ff 0%, #ddd0f3 55%, #a996cf 100%);
  box-shadow:0 0 40px 8px rgba(214,196,255,.35), 0 0 120px 30px rgba(180,75,255,.18)}
.bats{position:absolute;top:calc(1.2rem + env(safe-area-inset-top,0px));right:max(3%, calc(50% - 540px));width:clamp(90px,18vw,170px);fill:#0c0517;opacity:.9}
.marca{position:relative;display:inline-flex;align-items:center;gap:.5rem;margin:0 0 .4rem;
  font-family:var(--cond);font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);letter-spacing:.04em;color:var(--ouro);
  text-shadow:0 0 6px rgba(255,179,71,.8), 0 0 18px rgba(255,122,26,.55)}
.marca svg{width:2.2em;height:auto;stroke:var(--ouro);fill:none;stroke-width:2.2;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(255,179,71,.8))}
.marca svg.dir{transform:scaleX(-1)}
h1{position:relative;margin:0;padding:0 1rem;font-family:var(--neon);font-weight:400;line-height:.95;text-transform:uppercase}
h1 .rosa{display:block;font-size:clamp(2.6rem,11.5vw,6.2rem);letter-spacing:.02em;color:var(--rosa-claro);
  text-shadow:0 0 2px #fff, 0 0 8px var(--rosa), 0 0 18px var(--rosa), 0 0 38px var(--lilas), 0 0 70px var(--lilas)}
h1 .ouro{display:block;font-size:clamp(3.4rem,15vw,8rem);color:#fff3dc;margin-top:.05em;
  text-shadow:0 0 2px #fff, 0 0 8px var(--ouro), 0 0 20px var(--laranja), 0 0 44px var(--laranja)}
.skyline{display:block;width:100%;height:clamp(140px,24vw,240px);margin-top:-1rem}

/* acende uma vez, como letreiro */
@media (prefers-reduced-motion: no-preference){
  h1 .rosa{animation:acende 1.6s ease-out both}
  h1 .ouro{animation:acende 1.6s .35s ease-out both}
  @keyframes acende{0%{opacity:.15;text-shadow:none}12%{opacity:1}16%{opacity:.3}22%{opacity:1}30%{opacity:.55}38%,100%{opacity:1}}
}

/* ---------- Caixa da premiação ---------- */
.premiacao{position:relative;width:calc(100% - 2rem);max-width:640px;margin:-1.4rem auto 0;padding:1.1rem 1.2rem 1.2rem;text-align:center;
  background:rgba(14,7,26,.88);border:3px solid var(--lima);border-radius:18px;
  box-shadow:0 0 10px rgba(195,255,61,.75), 0 0 34px rgba(195,255,61,.35), inset 0 0 18px rgba(195,255,61,.22)}
.premiacao h2{margin:0;font-family:var(--cond);font-weight:700;font-size:clamp(1.7rem,6.4vw,2.4rem);line-height:1.05;text-transform:uppercase;
  color:var(--lima-texto);text-shadow:0 0 6px rgba(195,255,61,.8), 0 0 18px rgba(195,255,61,.45)}
.premios{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;list-style:none;padding:0;margin:.9rem 0 0}
.premios li{display:flex;flex-direction:column;align-items:center;padding:.35rem 0;border-left:1px solid rgba(195,255,61,.3)}
.premios li:first-child{border-left:0}
.premios span{font-size:.95rem;color:var(--suave)}
.premios strong{font-size:clamp(1.35rem,5vw,1.7rem);font-weight:700;color:#fff;text-shadow:0 0 8px rgba(195,255,61,.6)}

/* ---------- Conteúdo ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:1.6rem 1rem 4rem}
.steps{display:flex;gap:.5rem;list-style:none;padding:0;margin:0 0 2rem;justify-content:center}
.steps li{flex:1;max-width:200px;text-align:center;padding:.45rem .5rem;border-radius:999px;border:1.5px solid var(--linha);color:var(--suave);font-size:1rem;font-weight:600}
.steps li.on{color:#fff;border-color:var(--rosa);background:rgba(255,79,216,.14);box-shadow:0 0 12px rgba(255,79,216,.45)}
.steps li.done{color:var(--texto)}
.steps b{font-weight:700;margin-right:.3rem;color:var(--ouro)}
main h2{font-family:var(--neon);font-weight:400;font-size:clamp(2rem,7vw,3rem);line-height:1.05;margin:0 0 .4rem;color:var(--rosa-claro);
  text-shadow:0 0 6px var(--rosa), 0 0 22px rgba(180,75,255,.7)}
p{margin:.3rem 0 0;max-width:62ch}
.lead{color:var(--suave);font-size:1.15rem}
main > h2, main > .lead{text-align:center;margin-left:auto;margin-right:auto}
.notice{padding:1rem 1.2rem;border-radius:14px;border:1.5px solid var(--rosa);background:rgba(255,79,216,.1);margin:1rem auto;max-width:640px;text-align:center}
.status{min-height:1.4em;color:var(--suave);font-size:1rem}
.status.err{color:var(--erro)}
.status.ok{color:var(--lima-texto)}

/* espera */
.espera{text-align:center;padding:1rem 0}
.contador{display:inline-flex;flex-direction:column;align-items:center;margin-top:1.4rem;padding:1rem 2rem;border-radius:20px;border:1.5px solid rgba(255,179,71,.5);background:rgba(255,179,71,.06)}
.contador strong{font-family:var(--neon);font-weight:400;font-size:4rem;line-height:1;color:#fff3dc;text-shadow:0 0 8px var(--ouro), 0 0 26px var(--laranja)}
.contador span{color:var(--suave)}

/* votação */
.progress{display:flex;align-items:baseline;justify-content:center;gap:.8rem;flex-wrap:wrap;margin:1.2rem auto 1.6rem;max-width:640px;text-align:center}
.progress strong{font-size:1.15rem}
.bar{flex-basis:100%;height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rosa),var(--ouro));box-shadow:0 0 10px var(--rosa);transition:width .3s}
.grid{display:grid;gap:1.4rem;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid rgba(255,79,216,.28);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card .photo{position:relative;aspect-ratio:3/4;background:#120822}
.card .photo img{width:100%;height:100%;object-fit:cover}
.card .tag{position:absolute;left:.7rem;top:.7rem;background:var(--ouro);color:#2a1300;font-weight:700;border-radius:999px;padding:.1rem .75rem;font-size:1rem;box-shadow:0 0 12px rgba(255,179,71,.7)}
.card .body{padding:.9rem 1rem 1.1rem}
.costume{font-weight:700;font-size:1.7rem;line-height:1.05;color:#fff}
.who{color:var(--suave);font-size:1rem}
.score{display:grid;grid-template-columns:repeat(10,1fr);gap:.28rem;margin-top:.9rem}
.score button{border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.03);border-radius:10px;min-height:42px;padding:0;font-weight:700;font-size:1.05rem;cursor:pointer;color:var(--texto)}
.score button.under{border-color:rgba(255,79,216,.75);color:var(--rosa-claro)}
.score button[aria-pressed="true"]{background:var(--rosa);border-color:var(--rosa);color:#2b0026;box-shadow:0 0 14px var(--rosa)}

/* resultado */
.podium{display:grid;gap:1.4rem;grid-template-columns:1fr;margin-bottom:2rem}
@media (min-width:760px){.podium{grid-template-columns:1fr 1.2fr 1fr;align-items:end}.podium .p1{order:2}.podium .p2{order:1}.podium .p3{order:3}}
.podium .p1{border-color:var(--ouro);box-shadow:0 0 22px rgba(255,179,71,.45)}
.place{font-family:var(--neon);font-weight:400;font-size:3rem;line-height:1;color:#fff3dc;text-shadow:0 0 8px var(--ouro), 0 0 24px var(--laranja)}
.p1 .place{font-size:4rem}
.premio{display:inline-block;margin:.4rem 0 .2rem;padding:.1rem .7rem;border-radius:999px;border:1.5px solid var(--lima);color:var(--lima-texto);font-weight:700;font-size:1.05rem;text-shadow:0 0 6px rgba(195,255,61,.6)}
.avg{font-weight:700;font-size:1.4rem;color:#fff}
.rank{list-style:none;padding:0;margin:0;border-top:1px solid var(--linha)}
.rank li{display:grid;grid-template-columns:2.6rem 56px 1fr auto;gap:.8rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--linha)}
.rank img{width:56px;height:72px;object-fit:cover;border-radius:10px;background:#120822}
.rank .n{font-weight:700;color:var(--suave)}

.teia{position:fixed;bottom:0;width:150px;opacity:.16;pointer-events:none;stroke:#e9dcff;fill:none;stroke-width:1}
.teia.esq{left:0}.teia.dir{right:0;transform:scaleX(-1)}
@media (max-width:640px){.teia{width:90px}}

/* login, confirmação e barra de envio */
.painel{max-width:560px;margin:0 auto;padding:1.6rem 1.4rem;text-align:center;border-radius:22px;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid rgba(255,79,216,.35);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.painel .lead{margin:.4rem auto 0}
.campo{display:block;text-align:left;margin-top:1rem}
.campo span{display:block;font-weight:600;font-size:1rem;color:var(--suave);margin-bottom:.3rem}
.campo input,.campo select{width:100%;min-height:52px;padding:.7rem .9rem;border-radius:14px;border:1.5px solid rgba(255,255,255,.2);background:#120822;color:var(--texto);font:inherit;font-size:1.15rem}
.campo input:focus,.campo select:focus{outline:none;border-color:var(--rosa);box-shadow:0 0 12px rgba(255,79,216,.45)}
.btn-neon{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:.7rem 2.2rem;margin-top:1.3rem;border:0;border-radius:999px;cursor:pointer;
  font-family:var(--cond);font-weight:700;font-size:1.35rem;letter-spacing:.06em;color:#1b0a00;background:linear-gradient(90deg,var(--ouro),#ffd27a);box-shadow:0 0 18px rgba(255,179,71,.7)}
.btn-neon:disabled{opacity:.6;cursor:wait}
.btn-contorno{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:.6rem 1.6rem;margin-top:1.3rem;border-radius:999px;cursor:pointer;
  font-family:var(--cond);font-weight:700;font-size:1.15rem;background:transparent;color:var(--rosa-claro);border:2px solid var(--rosa);box-shadow:0 0 12px rgba(255,79,216,.4)}
.link{background:none;border:0;padding:.3rem;cursor:pointer;color:var(--suave);text-decoration:underline;font:inherit;font-size:1rem}
.dica{font-size:1rem;color:var(--suave);margin:1rem auto 0}
.login .status{text-align:center;margin:.6rem auto 0}
.eu{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:.2rem .8rem;margin:0 auto 1.2rem;text-align:center;color:var(--suave)}
.eu strong{color:#fff}
.selo{width:84px;height:84px;margin:0 auto .8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:700;
  color:#1a2b00;background:var(--lima);box-shadow:0 0 22px rgba(195,255,61,.8),0 0 60px rgba(195,255,61,.35)}
.selo.alerta{background:var(--ouro);color:#2a1300;box-shadow:0 0 22px rgba(255,179,71,.8)}
.confirmado{border-color:rgba(195,255,61,.55)}
@media (prefers-reduced-motion: no-preference){.recem .selo{animation:pulo .6s cubic-bezier(.2,1.6,.4,1) both}@keyframes pulo{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}}
.propria{margin-top:.8rem;font-size:1rem;color:var(--suave)}
.barra-envio{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:1rem;padding:.7rem max(1rem,calc(50% - 520px)) calc(.7rem + env(safe-area-inset-bottom,0px));
  background:rgba(18,8,34,.94);border-top:1px solid rgba(255,79,216,.4);box-shadow:0 -8px 30px rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.barra-info{flex:1;min-width:0;text-align:left}
.barra-info .bar{margin:.35rem 0 .1rem}
.barra-info .status{display:block;min-height:1.2em;font-size:.95rem}
.barra-envio .btn-neon{margin:0;padding:.6rem 1.6rem;flex:none}
body.com-barra{padding-bottom:calc(7rem + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<script>
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

/** Conversa com o Apps Script sem enviar a conta Google do aparelho. */
async function api(params, corpo) {
  const url = API + "?api=1&" + new URLSearchParams(params || {}).toString();
  const opcoes = corpo
    ? { method: "POST", body: JSON.stringify(corpo), credentials: "omit", redirect: "follow" }
    : { method: "GET", credentials: "omit", redirect: "follow" };
  const r = await fetch(corpo ? API : url, opcoes);
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || "Erro no servidor");
  return j.dados;
}

/**
 * Foto do Drive. Tenta o link público; se não carregar,
 * pede a imagem ao servidor (plano B).
 */
function foto(fotoId, alt, buscarNoServidor) {
  const img = el("img", {
    src: "https://drive.google.com/thumbnail?id=" + encodeURIComponent(fotoId) + "&sz=w1000",
    alt: alt || "", loading: "lazy", referrerpolicy: "no-referrer"
  });
  let tentouPlanoB = false;
  img.addEventListener("error", () => {
    if (tentouPlanoB) return;
    tentouPlanoB = true;
    buscarNoServidor(fotoId).then(url => { img.src = url; }).catch(() => { img.alt = "Foto indisponível"; });
  });
  return img;
}

const fmt = n => n.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

function montarResultado(res, buscarFoto) {
  const frag = document.createDocumentFragment();
  if (!res.lista.length) {
    frag.append(el("p", { class: "lead", text: "Nenhuma fantasia participou do concurso." }));
    return frag;
  }
  const e = res.eleitores;
  frag.append(el("p", { class: "lead", style: "margin:0 auto 1.8rem;text-align:center",
    text: `${e} ${e === 1 ? "pessoa votou" : "pessoas votaram"}. A classificação usa a média das notas; em caso de empate, vence quem recebeu mais notas.` }));
  const podio = el("div", { class: "podium" });
  res.lista.slice(0, 3).forEach((r, i) => podio.append(el("article", { class: "card p" + (i + 1) },
    el("div", { class: "photo" }, foto(r.fotoId, "Fantasia: " + r.fantasia, buscarFoto)),
    el("div", { class: "body" },
      el("div", { class: "place", text: (i + 1) + "º" }),
      el("div", { class: "premio", text: ["R$ 300", "R$ 100", "R$ 50"][i] + " no Pix" }),
      el("div", { class: "costume", text: r.fantasia }),
      r.nome ? el("div", { class: "who", text: r.nome }) : null,
      el("p", {}, el("span", { class: "avg", text: r.qtd ? fmt(r.media) : "–" }),
        el("span", { class: "who", text: r.qtd ? `  média de ${r.qtd} ${r.qtd === 1 ? "nota" : "notas"}` : "  sem notas" }))))));
  frag.append(podio);
  if (res.lista.length > 3) {
    const ol = el("ol", { class: "rank" });
    res.lista.slice(3).forEach((r, i) => ol.append(el("li", {},
      el("span", { class: "n", text: (i + 4) + "º" }),
      el("div", {}, foto(r.fotoId, "", buscarFoto)),
      el("div", {}, el("div", { style: "font-weight:600", text: r.fantasia }), r.nome ? el("div", { class: "who", text: r.nome }) : null),
      el("span", { class: "avg", text: r.qtd ? fmt(r.media) : "–" }))));
    frag.append(ol);
  }
  return frag;
}

function marcarEtapa(fase) {
  const ordem = ["inscricoes", "votacao", "resultado"], cur = ordem.indexOf(fase);
  document.querySelectorAll("#steps li").forEach(li => {
    const i = ordem.indexOf(li.dataset.p);
    li.classList.toggle("on", i === cur);
    li.classList.toggle("done", i < cur);
    if (i === cur) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
  });
}

function status(msg, tipo) {
  const s = $("#status"); if (!s) return;
  s.textContent = msg || ""; s.className = "status" + (tipo ? " " + tipo : "");
}

function erroTexto(e) {
  return (e && e.message ? e.message : String(e || "")).replace(/^Exception:\s*/, "") || "Algo deu errado. Tente de novo.";
}
</script>

<script>
// Endereço do Apps Script (URL /exec da implantação)
const API = "https://script.google.com/macros/s/AKfycbzu3DfzBCnQFqvq73ZFe79V6-bxgG7V3TVa1ugRtjdnbhCvIpZbzHHYov8Ku3s0e3fegg/exec";

const CHAVE_DISP = "fantasias_daf_dispositivo";
const CHAVE_NOME = "fantasias_daf_participante";
const CHAVE_RASCUNHO = "fantasias_daf_rascunho";

const S = {
  fase: null, total: 0, candidatos: [], participantes: [], resultado: null,
  eu: null, meuVoto: undefined, rascunho: {}, tela: null, editando: false, chave: "", enviando: false
};

/* ---------- Armazenamento local (com proteção) ---------- */
const ler = (k, padrao) => { try { const v = localStorage.getItem(k); return v == null ? padrao : JSON.parse(v); } catch (e) { return padrao; } };
const gravar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function idDispositivo() {
  const gerar = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : "d-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12);
  let d = ler(CHAVE_DISP, null);
  if (!d) { d = gerar(); gravar(CHAVE_DISP, d); }
  return d;
}
const DISP = idDispositivo();
S.eu = ler(CHAVE_NOME, null);
S.rascunho = ler(CHAVE_RASCUNHO, {}) || {};

const chave = n => String(n || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const buscarFoto = id => api({ acao: "foto", id }).then(d => d.url);
const minhaFantasia = c => S.eu && chave(c.nome) && chave(c.nome) === chave(S.eu);
const votaveis = () => S.candidatos.filter(c => !minhaFantasia(c));

/* ---------- Comunicação ---------- */
async function atualizar(comVoto) {
  try {
    const params = { acao: "estado", d: DISP };
    if (S.eu) params.n = S.eu;
    if (comVoto) params.m = "1";
    const st = await api(params);
    S.fase = st.fase;
    S.total = st.total;
    S.candidatos = st.candidatos || [];
    S.resultado = st.resultado || null;
    if (st.participantes) S.participantes = st.participantes;
    if (S.eu && st.fase === "votacao" && st.participante === null) sair(true); // nome removido da lista
    if (comVoto && "meuVoto" in st) S.meuVoto = st.meuVoto;
    render();
  } catch (e) {
    if (!S.fase) $("#main").replaceChildren(el("div", { class: "notice", text: "Não foi possível carregar o concurso. Verifique a conexão e recarregue a página." }));
  }
}

/* ---------- Telas ---------- */
function definirTela() {
  if (S.fase === "inscricoes") return "espera";
  if (S.fase === "resultado") return "resultado";
  if (!S.eu) return "login";
  if (S.meuVoto === undefined) return "carregando";
  if (S.meuVoto && S.meuVoto.outroAparelho) return "bloqueado";
  if (S.meuVoto && !S.editando) return "enviado";
  return "votar";
}

function render() {
  marcarEtapa(S.fase);
  const tela = definirTela();
  const extra = tela === "votar" ? S.candidatos.map(c => c.id + c.fotoId + c.fantasia + c.nome).join(",")
    : tela === "resultado" ? JSON.stringify(S.resultado)
    : tela === "login" ? S.participantes.join("|")
    : tela === "enviado" ? String(S.meuVoto && S.meuVoto.enviadoEm) : "";
  const k = tela + "|" + (S.eu || "") + "|" + extra;
  if (tela === "espera" && S.chave.startsWith("espera|")) { const t = $("#total"); if (t) t.textContent = S.total; return; }
  if (k === S.chave) { if (tela === "votar") pintarNotas(); return; }
  S.chave = k;
  const main = $("#main");
  document.body.classList.toggle("com-barra", tela === "votar");
  ({ espera: telaEspera, resultado: telaResultado, login: telaLogin, carregando: telaCarregando,
     bloqueado: telaBloqueado, enviado: telaEnviado, votar: telaVotar })[tela](main);
}

function telaEspera(main) {
  main.replaceChildren(el("div", { class: "espera" },
    el("h2", { text: "A votação ainda não começou" }),
    el("p", { class: "lead", style: "margin:0 auto", text: "As fantasias estão sendo fotografadas. Deixe esta página aberta: a votação aparece aqui assim que for liberada." }),
    el("div", { class: "contador" }, el("strong", { id: "total", text: String(S.total) }), el("span", { text: "fantasias cadastradas" }))));
}

function telaCarregando(main) {
  main.replaceChildren(el("p", { class: "lead", style: "text-align:center;margin:2rem auto", text: "Conferindo seu voto…" }));
}

function telaLogin(main) {
  if (!S.participantes.length) {
    main.replaceChildren(el("div", { class: "notice", text: "A lista de participantes ainda não foi cadastrada. Procure a organização." }));
    return;
  }
  const busca = el("input", { type: "search", id: "busca", placeholder: "Digite parte do seu nome", autocomplete: "off", "aria-label": "Buscar nome" });
  const lista = el("select", { id: "nome", "aria-label": "Seu nome" });
  const preencher = () => {
    const q = chave(busca.value);
    const nomes = S.participantes.filter(n => !q || chave(n).includes(q));
    lista.replaceChildren(el("option", { value: "", text: nomes.length ? "Escolha seu nome" : "Nenhum nome encontrado" }),
      ...nomes.map(n => el("option", { value: n, text: n })));
    if (nomes.length === 1) lista.value = nomes[0];
  };
  busca.addEventListener("input", preencher);
  preencher();
  const entrar = el("button", { class: "btn-neon", type: "button", onclick: () => {
    const n = lista.value;
    if (!n) { status("Escolha seu nome na lista.", "err"); lista.focus(); return; }
    S.eu = n; gravar(CHAVE_NOME, n);
    S.meuVoto = undefined; S.editando = false; S.rascunho = {}; gravar(CHAVE_RASCUNHO, null);
    render(); atualizar(true);
  } }, "Entrar");
  main.replaceChildren(el("div", { class: "painel login" },
    el("h2", { text: "Quem está votando?" }),
    el("p", { class: "lead", text: "Escolha seu nome na lista de convidados da festa." }),
    el("label", { class: "campo" }, el("span", { text: "Buscar" }), busca),
    el("label", { class: "campo" }, el("span", { text: "Seu nome" }), lista),
    entrar,
    el("p", { class: "status", id: "status", "aria-live": "polite" }),
    el("p", { class: "dica", text: "Não encontrou seu nome? Procure a organização da festa." })));
}

function cabecalhoEu() {
  return el("div", { class: "eu" },
    el("span", {}, "Votando como ", el("strong", { text: S.eu })),
    el("button", { class: "link", type: "button", onclick: () => sair() }, "Não é você? Trocar nome"));
}

function sair(silencioso) {
  S.eu = null; S.meuVoto = undefined; S.editando = false; S.rascunho = {};
  gravar(CHAVE_NOME, null); gravar(CHAVE_RASCUNHO, null);
  if (!silencioso) render();
}

function horario(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function telaBloqueado(main) {
  main.replaceChildren(el("div", { class: "painel aviso" },
    el("div", { class: "selo alerta", "aria-hidden": "true", text: "!" }),
    el("h2", { text: "Este nome já votou" }),
    el("p", { class: "lead", text: `${S.eu} já enviou um voto em outro aparelho${S.meuVoto.enviadoEm ? " às " + horario(S.meuVoto.enviadoEm) : ""}.` }),
    el("p", { class: "lead", text: "Se foi você em outro celular, procure a organização para liberar um novo voto." }),
    el("button", { class: "btn-contorno", type: "button", onclick: () => sair() }, "Não sou eu. Trocar nome")));
}

function telaEnviado(main) {
  const qtd = Object.keys(S.meuVoto.notas || {}).length;
  const recem = S.acabouDeEnviar; S.acabouDeEnviar = false;
  main.replaceChildren(el("div", { class: "painel confirmado" + (recem ? " recem" : "") },
    el("div", { class: "selo", "aria-hidden": "true", text: "✓" }),
    el("h2", { text: recem ? "Voto enviado!" : "Seu voto já foi registrado" }),
    el("p", { class: "lead", text: `Obrigado, ${S.eu.split(" ")[0]}! Você deu nota para ${qtd} ${qtd === 1 ? "fantasia" : "fantasias"}${S.meuVoto.enviadoEm ? ", às " + horario(S.meuVoto.enviadoEm) : ""}.` }),
    el("p", { class: "lead", text: "Você pode mudar seu voto até a organização encerrar a votação. O resultado aparece nesta página." }),
    el("button", { class: "btn-contorno", type: "button", onclick: () => {
      S.editando = true; S.rascunho = Object.assign({}, S.meuVoto.notas); gravar(CHAVE_RASCUNHO, S.rascunho); render();
    } }, "Mudar meu voto"),
    el("button", { class: "link", type: "button", style: "display:block;margin:1rem auto 0", onclick: () => sair() }, "Não é você? Trocar nome")));
}

function telaVotar(main) {
  if (!S.candidatos.length) {
    main.replaceChildren(cabecalhoEu(), el("h2", { text: "Hora de votar" }), el("p", { class: "lead", text: "Nenhuma fantasia foi cadastrada." }));
    return;
  }
  const grid = el("div", { class: "grid" });
  S.candidatos.forEach(c => grid.append(cartao(c)));
  const barra = el("div", { class: "barra-envio" },
    el("div", { class: "barra-info" },
      el("strong", { id: "prog" }),
      el("div", { class: "bar" }, el("i", { id: "barra" })),
      el("span", { class: "status", id: "status", "aria-live": "polite" })),
    el("button", { class: "btn-neon", type: "button", id: "enviar", onclick: enviar }, "ENVIAR"));
  main.replaceChildren(
    cabecalhoEu(),
    el("h2", { text: S.editando ? "Mudando seu voto" : "Hora de votar" }),
    el("p", { class: "lead", text: "Dê uma nota de 1 a 10 para cada fantasia e toque em ENVIAR no fim. Suas notas só valem depois de enviadas." }),
    grid, barra);
  pintarNotas();
}

function cartao(c) {
  const corpo = el("div", { class: "body" },
    el("div", { class: "costume", text: c.fantasia }),
    c.nome ? el("div", { class: "who", text: c.nome }) : null);
  if (minhaFantasia(c)) {
    corpo.append(el("p", { class: "propria", text: "Esta é a sua fantasia. Não dá para votar em si mesmo." }));
  } else {
    const notas = el("div", { class: "score", role: "group", "aria-label": "Nota para " + c.fantasia, "data-id": c.id });
    for (let v = 1; v <= 10; v++) {
      notas.append(el("button", { type: "button", "data-v": v, "aria-pressed": "false", "aria-label": "Nota " + v, onclick: () => darNota(c.id, v) }, String(v)));
    }
    corpo.append(notas);
  }
  return el("article", { class: "card" },
    el("div", { class: "photo" }, foto(c.fotoId, "Fantasia: " + c.fantasia, buscarFoto), el("span", { class: "tag", text: "#" + c.numero })),
    corpo);
}

function darNota(id, v) {
  if (Number(S.rascunho[id]) === v) delete S.rascunho[id]; else S.rascunho[id] = v;
  gravar(CHAVE_RASCUNHO, S.rascunho);
  status("");
  pintarNotas();
}

function pintarNotas() {
  document.querySelectorAll(".score").forEach(g => {
    const atual = Number(S.rascunho[g.dataset.id]) || 0;
    g.querySelectorAll("button").forEach(b => {
      const v = Number(b.dataset.v);
      b.setAttribute("aria-pressed", v === atual ? "true" : "false");
      b.classList.toggle("under", atual > 0 && v < atual);
    });
  });
  const lista = votaveis();
  const feitas = lista.filter(c => Number(S.rascunho[c.id]) > 0).length;
  const p = $("#prog"), b = $("#barra");
  if (p) p.textContent = `${feitas} de ${lista.length} avaliadas`;
  if (b) b.style.width = lista.length ? (100 * feitas / lista.length) + "%" : "0";
}

async function enviar() {
  if (S.enviando) return;
  const lista = votaveis();
  const notas = {};
  lista.forEach(c => { const v = Number(S.rascunho[c.id]); if (v >= 1 && v <= 10) notas[c.id] = v; });
  const qtd = Object.keys(notas).length;
  if (!qtd) { status("Dê pelo menos uma nota antes de enviar.", "err"); return; }
  const faltam = lista.length - qtd;
  if (faltam > 0 && !confirm(`Você não deu nota para ${faltam} ${faltam === 1 ? "fantasia" : "fantasias"}. Enviar assim mesmo?`)) return;
  S.enviando = true;
  const botao = $("#enviar"); if (botao) { botao.disabled = true; botao.textContent = "ENVIANDO…"; }
  try {
    const r = await api(null, { acao: "votar", dispositivo: DISP, participante: S.eu, notas });
    S.meuVoto = { outroAparelho: false, enviadoEm: r.enviadoEm, notas: r.notas };
    S.editando = false; S.acabouDeEnviar = true;
    S.rascunho = {}; gravar(CHAVE_RASCUNHO, null);
    window.scrollTo({ top: 0, behavior: "smooth" });
    render();
  } catch (e) {
    const msg = erroTexto(e);
    status(msg, "err");
    if (/outro aparelho/.test(msg)) { S.meuVoto = undefined; atualizar(true); }
    else if (/não está aberta/.test(msg)) atualizar(false);
  } finally {
    S.enviando = false;
    const b2 = $("#enviar"); if (b2) { b2.disabled = false; b2.textContent = "ENVIAR"; }
  }
}

function telaResultado(main) {
  main.replaceChildren(el("h2", { text: "E a melhor fantasia é…" }), montarResultado(S.resultado, buscarFoto));
}

/* ---------- Início ---------- */
atualizar(true);
setInterval(() => { if (!document.hidden) atualizar(S.eu && S.meuVoto === undefined); }, 25000 + Math.floor(Math.random() * 10000));
document.addEventListener("visibilitychange", () => { if (!document.hidden) atualizar(false); });
</script>
